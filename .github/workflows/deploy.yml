name: Deploy independent Commonwealth
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "scripts/**"
      - "lean/**"
      - "lean-toolchain"
      - "site/**"
      - "README.md"
      - "index.html"
      - "commonwealth*"
      - "civic-tradeoffs*"
      - ".nojekyll"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "scripts/**"
      - "lean/**"
      - "lean-toolchain"
      - "site/**"
      - "README.md"
      - "index.html"
      - "commonwealth*"
      - ".nojekyll"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commonwealth-independent-pages
  cancel-in-progress: false
jobs:
  verify:
    name: Audit independent source and both publishing layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all static files, provenance, links and root/site parity
        run: python3 scripts/test_standalone.py .
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Independently audit fictional civic budget arithmetic
        run: node scripts/test_civic_tradeoffs.mjs
      - name: Audit dated legislative stress-test arithmetic
        run: node scripts/test_legislative_stress.mjs
      - name: Install pinned Lean toolchain
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Kernel-check legislative theorems and replay formal semantics
        run: |
          set -o pipefail
          lean --version
          lean --run lean/LegislativeStress.lean > "$RUNNER_TEMP/legislative-lean.txt"
          grep -v '^CW|' "$RUNNER_TEMP/legislative-lean.txt"
          node scripts/test_legislative_lean_bridge.mjs "$RUNNER_TEMP/legislative-lean.txt"
      - name: Browser-test civic journeys on phone and desktop
        run: |
          CHROME_BIN="$(command -v google-chrome)" \
            node scripts/test_commonwealth_browser.mjs site
      - name: Preserve browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commonwealth-standalone-browser
          path: browser-artifacts/commonwealth-independent-*.png
          if-no-files-found: ignore
  deploy:
    name: Publish site from its own repository
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.publish.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v4
      - name: Configure independent Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload only Commonwealth assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publish standalone site
        id: publish
        uses: actions/deploy-pages@v4
  live:
    name: Verify exact external website content
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ten public routes and assets against committed SHA-256
        run: python3 scripts/test_live_site.py
